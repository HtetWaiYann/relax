packages:
  - "apps/*"
  - "packages/*"

# These packages need to run install scripts to download platform binaries.
allowBuilds:
  '@bufbuild/buf': true
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-x64': true
  '@ffprobe-installer/win32-x64': true
  bufferutil: true
  electron: true
  esbuild: true
  ffmpeg-static: true
  ip-set: true
  node-datachannel: true
  utf-8-validate: true
  utp-native: true
